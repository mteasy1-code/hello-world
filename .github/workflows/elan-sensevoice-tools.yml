name: ELAN SenseVoice ASR Tools

on:
  push:
    paths:
      - '.github/workflows/elan-sensevoice-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download SenseVoice INT8 model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle/models
          curl -fL --retry 5 --retry-delay 3 \
            -o sensevoice.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2
          tar -xjf sensevoice.tar.bz2 -C bundle/models
          find bundle -type f -printf '%p\t%s bytes\n' | sort | tee bundle/FILES.txt
          test -s bundle/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx
          test -s bundle/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt
      - name: Upload SenseVoice model
        uses: actions/upload-artifact@v4
        with:
          name: elan-sensevoice-int8-model
          path: bundle
          compression-level: 0
          retention-days: 1

name: Temporary Whisper Small Model

on:
  push:
    paths:
      - '.github/workflows/temp-whisper-small.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download multilingual small quantized model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl -L --fail --retry 5 --retry-delay 5 \
            -o model/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          sha256sum model/ggml-small-q5_1.bin > model/SHA256SUMS.txt
          ls -lh model

      - name: Upload small model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5-1
          path: model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

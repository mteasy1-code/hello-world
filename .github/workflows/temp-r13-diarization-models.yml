name: TEMP R13 Diarization Models

on:
  push:
    paths:
      - '.github/workflows/temp-r13-diarization-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download open diarization models and Python wheel
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle/models bundle/wheels
          curl -fL --retry 5 --retry-delay 2 \
            -o bundle/pyannote-segmentation.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
          tar -xjf bundle/pyannote-segmentation.tar.bz2 -C bundle/models
          rm bundle/pyannote-segmentation.tar.bz2
          curl -fL --retry 5 --retry-delay 2 \
            -o bundle/models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
          python -m pip download --only-binary=:all: --no-deps \
            --platform manylinux2014_x86_64 --python-version 311 --implementation cp --abi cp311 \
            -d bundle/wheels sherpa-onnx
          find bundle -type f -printf '%p\t%s bytes\n' | sort
          sha256sum $(find bundle -type f | sort) > bundle/SHA256SUMS.txt
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: r13-open-diarization-bundle
          path: bundle
          compression-level: 0
          retention-days: 1

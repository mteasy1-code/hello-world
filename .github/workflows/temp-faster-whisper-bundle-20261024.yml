name: Temporary Faster Whisper Bundle

on:
  push:
    branches:
      - temp-faster-whisper-20261024

permissions:
  contents: read

jobs:
  build-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download offline Python wheels
        run: |
          python -m pip install --upgrade pip
          mkdir -p bundle/wheels bundle/model
          python -m pip download --only-binary=:all: --dest bundle/wheels \
            faster-whisper==1.2.0

      - name: Download multilingual small CTranslate2 model
        run: |
          python -m pip install faster-whisper==1.2.0
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Systran/faster-whisper-small',
              local_dir='bundle/model',
          )
          PY
          find bundle/model -type f -print0 | sort -z | xargs -0 sha256sum > bundle/MODEL_SHA256SUMS.txt
          find bundle/wheels -type f -print0 | sort -z | xargs -0 sha256sum > bundle/WHEELS_SHA256SUMS.txt

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-small-offline
          path: bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

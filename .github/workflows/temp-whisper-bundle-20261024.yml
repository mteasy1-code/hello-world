name: Temporary Whisper Linux Bundle

on:
  push:
    branches:
      - temp-whisper-model-20261024

permissions:
  contents: read

jobs:
  build-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl ca-certificates

      - name: Build whisper.cpp CLI
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git whispercpp
          cmake -S whispercpp -B whispercpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build whispercpp/build --target whisper-cli -j 2

      - name: Download multilingual model and verify bundle
        run: |
          mkdir -p bundle
          cp whispercpp/build/bin/whisper-cli bundle/
          curl -L --fail --retry 5 --retry-delay 5 \
            -o bundle/ggml-small-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true"
          chmod +x bundle/whisper-cli
          sha256sum bundle/whisper-cli bundle/ggml-small-q5_1.bin > bundle/SHA256SUMS.txt
          bundle/whisper-cli \
            -m bundle/ggml-small-q5_1.bin \
            -f whispercpp/samples/jfk.wav \
            -otxt -of bundle/smoke_test -np -nt
          test -s bundle/smoke_test.txt

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-small-q5_1
          path: bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

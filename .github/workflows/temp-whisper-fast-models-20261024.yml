name: Temporary Whisper Fast Models

on:
  push:
    branches:
      - temp-whisper-model-20261024

permissions:
  contents: read

jobs:
  fetch-models:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download multilingual base and tiny quantized models
        run: |
          mkdir -p models
          curl -L --fail --retry 5 --retry-delay 5 \
            -o models/ggml-base-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true"
          curl -L --fail --retry 5 --retry-delay 5 \
            -o models/ggml-tiny-q5_1.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin?download=true"
          sha256sum models/*.bin > models/SHA256SUMS.txt

      - name: Upload fast models
        uses: actions/upload-artifact@v4
        with:
          name: whisper-fast-models
          path: models/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

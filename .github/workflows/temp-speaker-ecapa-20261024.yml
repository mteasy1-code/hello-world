name: Temporary ECAPA Speaker Model Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - temp-faster-whisper-20261024
    paths:
      - '.github/workflows/temp-speaker-ecapa-20261024.yml'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download SpeechBrain ECAPA model
        run: |
          python -m pip install --upgrade pip huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='speechbrain/spkrec-ecapa-voxceleb',
              local_dir='ecapa_model',
              local_dir_use_symlinks=False,
          )
          PY
          find ecapa_model -type f -maxdepth 3 -print
          sha256sum $(find ecapa_model -type f | sort) > ECAPA_SHA256SUMS.txt
      - name: Upload ECAPA model
        uses: actions/upload-artifact@v4
        with:
          name: speechbrain-ecapa-voxceleb
          path: |
            ecapa_model
            ECAPA_SHA256SUMS.txt
          retention-days: 1
          compression-level: 0

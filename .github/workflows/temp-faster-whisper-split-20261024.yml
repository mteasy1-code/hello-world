name: Temporary Faster Whisper Split Bundle

on:
  push:
    branches:
      - temp-faster-whisper-20261024

permissions:
  contents: read

jobs:
  build-split:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare offline wheels and model
        run: |
          python -m pip install --upgrade pip
          mkdir -p wheels model checksums
          python -m pip download --only-binary=:all: --dest wheels faster-whisper==1.2.0
          python -m pip install faster-whisper==1.2.0
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='Systran/faster-whisper-small', local_dir='model')
          PY
          find model -type f -print0 | sort -z | xargs -0 sha256sum > checksums/MODEL_SHA256SUMS.txt
          find wheels -type f -print0 | sort -z | xargs -0 sha256sum > checksums/WHEELS_SHA256SUMS.txt
          du -sh model wheels

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-small-model
          path: |
            model/
            checksums/MODEL_SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 9
          retention-days: 1

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-offline-wheels
          path: |
            wheels/
            checksums/WHEELS_SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

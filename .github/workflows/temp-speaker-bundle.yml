name: Temporary Speaker Embedding Bundle

on:
  push:
    paths:
      - '.github/workflows/temp-speaker-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download ECAPA speaker model
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git clone --depth 1 https://huggingface.co/speechbrain/spkrec-ecapa-voxceleb speaker_model
          rm -rf speaker_model/.git
          find speaker_model -type f -print0 | sort -z | xargs -0 sha256sum > speaker_model/SHA256SUMS.txt
          du -ah speaker_model | sort -h | tail -20

      - name: Upload speaker model
        uses: actions/upload-artifact@v4
        with:
          name: speechbrain-ecapa-voxceleb
          path: speaker_model/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

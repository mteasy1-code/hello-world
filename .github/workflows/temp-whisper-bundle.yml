name: Temporary Whisper Static Tool

on:
  push:
    paths:
      - '.github/workflows/temp-whisper-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build static whisper.cpp CLI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_BUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build whisper-build --config Release -j 2
          mkdir -p tools
          cp whisper-build/bin/whisper-cli tools/
          chmod +x tools/whisper-cli
          sha256sum tools/whisper-cli > tools/SHA256SUMS.txt
          file tools/whisper-cli > tools/FILE.txt
          ldd tools/whisper-cli > tools/LDD.txt || true
          ./tools/whisper-cli --help > tools/HELP.txt 2>&1 || true

      - name: Upload static CLI
        uses: actions/upload-artifact@v4
        with:
          name: whisper-static-cli
          path: tools/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

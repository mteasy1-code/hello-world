name: Temporary Whisper Bundle

on:
  push:
    paths:
      - '.github/workflows/temp-whisper-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build whisper-build --config Release -j 2
          mkdir -p bundle
          cp whisper-build/bin/whisper-cli bundle/
          cp whisper.cpp/models/download-vad-model.sh bundle/
          chmod +x bundle/whisper-cli

      - name: Download multilingual model and VAD model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o bundle/ggml-large-v3-turbo-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          curl -L --fail --retry 5 --retry-delay 5 \
            -o bundle/ggml-silero-v6.2.0.bin \
            https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
          sha256sum bundle/* > bundle/SHA256SUMS.txt
          ldd bundle/whisper-cli > bundle/LDD.txt || true
          du -h bundle/*

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-large-v3-turbo-q5
          path: bundle/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

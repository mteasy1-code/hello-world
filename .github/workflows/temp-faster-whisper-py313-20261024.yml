name: Temporary Faster Whisper Python 3.13 Wheels

on:
  push:
    branches:
      - temp-faster-whisper-20261024

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download Python 3.13 offline wheels
        run: |
          python -m pip install --upgrade pip
          mkdir -p wheels checksums
          python -m pip download --only-binary=:all: --dest wheels faster-whisper==1.2.0
          find wheels -type f -print0 | sort -z | xargs -0 sha256sum > checksums/WHEELS_PY313_SHA256SUMS.txt
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path('wheels').glob('*.whl')):
              print(p.name)
          PY
      - name: Upload Python 3.13 wheels
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-py313-wheels
          path: |
            wheels/
            checksums/WHEELS_PY313_SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

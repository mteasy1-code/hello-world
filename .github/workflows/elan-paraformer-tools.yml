name: ELAN Paraformer Chinese ASR Tools

on:
  push:
    paths:
      - '.github/workflows/elan-paraformer-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download Paraformer Chinese INT8 model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle/models
          curl -fL --retry 5 --retry-delay 3 \
            -o paraformer.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-paraformer-zh-int8-2025-10-07.tar.bz2
          tar -xjf paraformer.tar.bz2 -C bundle/models
          find bundle -type f -printf '%p\t%s bytes\n' | sort | tee bundle/FILES.txt
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: elan-paraformer-zh-int8-model
          path: bundle
          compression-level: 0
          retention-days: 1
